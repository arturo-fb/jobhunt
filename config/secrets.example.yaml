# -----------------------------------------------------------------------------
# Copy this file to  secrets.yaml  and fill in your keys.
# secrets.yaml is git-ignored / never shared. This example file has no secrets.
#
# Adzuna  (free): sign up at https://developer.adzuna.com  -> get app_id + app_key
# USAJobs (free): sign up at https://developer.usajobs.gov -> get an API key
# -----------------------------------------------------------------------------

adzuna:
  app_id: "YOUR_ADZUNA_APP_ID"
  app_key: "YOUR_ADZUNA_APP_KEY"

usajobs:
  email: "you@example.com"
  api_key: "YOUR_USAJOBS_API_KEY"
